<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Huna7-OS</title>
  <meta name="description" content="Huna7-OS — A Premium Browser Operating System" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'SF Pro Display', -apple-system, 'Segoe UI', sans-serif; color: #fff; }
    #huna7-root { width: 100vw; height: 100vh; position: relative; overflow: hidden; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.32); }
  </style>
</head>
<body>
<div id="huna7-root"></div>

<!-- ① Core utilities (no dependencies) -->
<script src="notebook/utilities/constants.js"></script>
<script src="notebook/utilities/helpers.js"></script>
<script src="notebook/utilities/storage.js"></script>
<script src="notebook/utilities/security.js"></script>
<script src="notebook/utilities/animations.js"></script>
<script src="notebook/utilities/errors.js"></script>

<!-- ② Event bus (needed by almost everything) -->
<script src="notebook/pencil/binder.js"></script>

<!-- ③ UI library -->
<script src="notebook/library/dictionary.js"></script>
<script src="notebook/library/glossary.js"></script>
<script src="notebook/library/encyclopedia.js"></script>
<script src="notebook/library/indexer.js"></script>

<!-- ④ Storage layer -->
<script src="notebook/backpack/organizer.js"></script>
<script src="notebook/backpack/notebook.js"></script>
<script src="notebook/backpack/folder.js"></script>
<script src="notebook/backpack/archive.js"></script>

<!-- ⑤ Notebook subsystem (user environment) -->
<script src="notebook/migrations.js"></script>
<script src="notebook/profile.js"></script>
<script src="notebook/sessions.js"></script>
<script src="notebook/authentication.js"></script>
<script src="notebook/preferences.js"></script>
<script src="notebook/registry.js"></script>
<script src="notebook/filesystem-index.js"></script>
<script src="notebook/themes.js"></script>
<script src="notebook/wallpaper.js"></script>
<script src="notebook/startup-apps.js"></script>
<script src="notebook/recent-files.js"></script>
<script src="notebook/shortcuts.js"></script>
<script src="notebook/updates.js"></script>

<!-- ⑥ Kernel subsystem -->
<script src="notebook/pencil/compass.js"></script>
<script src="notebook/pencil/ruler.js"></script>
<script src="notebook/pencil/schedule.js"></script>
<script src="notebook/pencil/eraser.js"></script>
<script src="notebook/pencil/chalk.js"></script>

<!-- ⑦ VoxScript language engine -->
<script src="notebook/voxscript/sentence.js"></script>
<script src="notebook/voxscript/alphabet.js"></script>
<script src="notebook/voxscript/grammar.js"></script>
<script src="notebook/voxscript/translator.js"></script>
<script src="notebook/voxscript/machine.js"></script>
<script src="notebook/voxscript/standardbook.js"></script>
<script src="notebook/voxscript/runtime.js"></script>
<script src="notebook/voxscript/debugger.js"></script>

<!-- ⑧ Workshop utilities -->
<script src="notebook/workshop/toolbox.js"></script>
<script src="notebook/workshop/sketch.js"></script>
<script src="notebook/workshop/blueprint.js"></script>
<script src="notebook/workshop/drafting.js"></script>
<script src="notebook/workshop/prototype.js"></script>

<!-- ⑨ Desktop environment -->
<script src="notebook/classroom/attendance.js"></script>
<script src="notebook/classroom/homeroom.js"></script>
<script src="notebook/classroom/bulletin.js"></script>
<script src="notebook/classroom/desk.js"></script>
<script src="notebook/classroom/taskbar.js"></script>
<script src="notebook/classroom/blackboard.js"></script>

<!-- ⑩ Applications -->
<script src="notebook/applications/explorer.js"></script>
<script src="notebook/applications/terminal.js"></script>
<script src="notebook/applications/themes.js"></script>
<script src="notebook/applications/settings.js"></script>
<script src="notebook/applications/calculator.js"></script>
<script src="notebook/applications/clock.js"></script>
<script src="notebook/applications/media.js"></script>
<script src="notebook/applications/browser.js"></script>
<script src="notebook/applications/voxstudio.js"></script>
<script src="notebook/applications/monitor.js"></script>
<script src="notebook/applications/notes.js"></script>
<script src="notebook/applications/images.js"></script>
<script src="notebook/applications/audio.js"></script>
<script src="notebook/applications/workspace.js"></script>
<script src="notebook/applications/packagecenter.js"></script>
<script src="notebook/applications/glibrary.js"></script>

<!-- ⑩½ Launcher -->
<script src="notebook/launcher.js"></script>

<!-- ⑪ Startup system (loads last — controls everything) -->
<script src="notebook/startup/logo.js"></script>
<script src="notebook/startup/splash.js"></script>
<script src="notebook/startup/loading.js"></script>
<script src="notebook/startup/launch.js"></script>

<!-- ⑫ Power button -->
<script>
  window.addEventListener('DOMContentLoaded', () => {
    Huna7.Errors.installGlobalHandlers();
    Huna7.Startup.Launch.boot(document.getElementById('huna7-root'));
  });
</script>
</body>
</html>
